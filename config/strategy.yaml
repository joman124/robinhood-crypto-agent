# Strategy parameters.
#
# Weights are per-regime and are L1-normalized on load, so they are read as
# relative importance rather than needing to sum to 1 by hand.

strategy:
  # Bars are aggregated from ingested quotes -- see docs/data-constraints.md.
  # A 60-minute bar needs roughly hourly ingestion to be well-sampled.
  bar_interval_minutes: 60
  min_bars: 30

  fast_ma: 12
  slow_ma: 26
  signal_ma: 9
  rsi_period: 14
  atr_period: 14
  adx_period: 14
  adx_trend_threshold: 22
  breakout_lookback: 20

  # Sizing cuts exposure when realized volatility runs above this per-bar target.
  target_volatility_pct: 1.0
  volatility_lookback: 20

  # How long a headline can move the news signal. Its confidence decays
  # linearly to zero across the window.
  news_window_minutes: 120

  # The time exit, added by the owner 2026-09-26. Once a coin the agent bought
  # has been held this many bars (6 x 60 min = 6 hours), `rhca run` and
  # `rhca analyze` propose selling it, for approval by id like any trade. Six
  # matches the horizon every proposal is scored on. 0 turns it off. It only
  # ever sells what the agent's own recorded buys added -- never a coin bought
  # outside it.
  exit_after_bars: 6

  # news is optional: it counts only when a recent headline exists, so its
  # weight never dilutes the price signals on a quiet day. At 0.50 against
  # price weights summing to 1, news alone moves a neutral price view to at
  # most +/-0.33 -- past the 0.3 trigger (config/pipeline.yaml) only for a
  # major headline labeled with near-full confidence. Mostly it tips a price
  # signal that already leans the same way.
  weights:
    trending:
      trend: 0.50
      momentum: 0.25
      breakout: 0.15
      mean_reversion: 0.10
      news: 0.50
    ranging:
      mean_reversion: 0.50
      breakout: 0.20
      trend: 0.15
      momentum: 0.15
      news: 0.50
    unknown:
      trend: 0.25
      momentum: 0.25
      breakout: 0.25
      mean_reversion: 0.25
      news: 0.50
