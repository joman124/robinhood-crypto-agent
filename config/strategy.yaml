# The trading rule: the trend ladder. See docs/strategy.md.
#
# It replaced System 1 (indicators, news, the escalation trigger and System 2)
# at the owner's request, 2026-09-27, after the backtests in docs/strategy.md.
# `rhca backtest` replays exactly this rule, so its "ladder (anchor) +50d exit"
# row is the evidence for what the agent proposes.

strategy:
  # Bars are aggregated from ingested quotes, with Coinbase bars filling in
  # history -- see docs/data-constraints.md. The rule decides on closed bars.
  bar_interval_minutes: 60

  # percent under the anchor : dollars. Buy $5 on a close 5% under the
  # anchor, $10 at 10% under, $20 at 20% under -- each once per cycle. Sells
  # mirror them over the anchor: $5 worth at +5%, $10 worth at +10%, and
  # everything left at +20%. At most $35 is in one coin at a time.
  steps: "5:5,10:10,20:20"

  # Buy only on a close above the average of the last 50 days of hourly
  # closes. Fixed at 50 by the owner before any result was seen. 0 turns the
  # filter off, and the trend exit with it.
  trend_days: 50

  # Sell everything on a close at or under that average. The filter alone
  # only stops buying in a downtrend; the ladder then held what it had bought
  # all the way down (-12% on BTC and -24% on ETH, on capital, over the year
  # to 2026-09-27). This is the fix. It was added without a backtest: the
  # "+50d exit" rows of `rhca backtest` are the evidence to read before
  # approving the first proposal.
  trend_exit: true

  # While the agent holds none of a coin, a dip is measured from the highest
  # close since this date or since the agent last sold out of it, whichever is
  # later. The day the ladder went live, so the first dip is measured from
  # prices the agent actually watched.
  anchor_since: 2026-09-27
