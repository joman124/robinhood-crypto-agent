# The real-time loop: `rhca run`.
#
#   Robinhood quotes -> hourly bars -> the trend ladder + 14 risk rules -> proposal
#
# Shadow mode: nothing here can place an order. Every proposal is logged, and a
# human approves each one by id before Claude places it.

pipeline:
  # Cadences. Robinhood does not publish its rate limit; community clients
  # budget ~100 requests/minute, and one quote poll covers the whole watchlist.
  quote_interval_seconds: 60
  account_interval_seconds: 600    # trading pairs (balance, holdings: rhca ingest)
  sync_interval_seconds: 300       # dashboard push/pull, when configured
