[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "robinhood-crypto-agent"
version = "0.1.0"
description = "A propose-only Robinhood crypto trading agent: a real-time System 1 (indicators + Jev news labels) that escalates to Claude Sonnet 5."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0",
    # System 2. Imported lazily by the CLI, so the decision engine and its
    # tests never load it.
    "anthropic>=1.0,<2",
    # Ed25519 request signing for Robinhood's Crypto Trading API.
    "cryptography>=42",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    # Pinned to a minor series: an unpinned ruff turns CI red on a release that
    # adds a rule, which is a failure of the lint pin rather than of the code.
    "ruff>=0.16,<0.17",
]

[project.scripts]
rhca = "robinhood_crypto_agent.cli:main"
robinhood-crypto-agent = "robinhood_crypto_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
# Correctness rules only. Stylistic rulesets are deliberately not enabled:
# `Decimal("100")` over `Decimal(100)` is a house convention here, not a nit.
select = ["E4", "E7", "E9", "F", "B", "I"]

[tool.ruff.lint.isort]
known-first-party = ["robinhood_crypto_agent"]
