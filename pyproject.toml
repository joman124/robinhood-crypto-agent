[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "robinhood-crypto-agent"
version = "0.1.0"
description = "A Robinhood crypto trading agent operated through Claude Code, with a regime-aware multi-signal strategy, hard risk limits, and a propose-only (human-approved) execution gate."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pandas>=2.1",
    "numpy>=1.26",
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "typer>=0.12",
    "httpx>=0.27",
    "diskcache>=5.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "ruff>=0.4",
]

[project.scripts]
robinhood-crypto-agent = "robinhood_crypto_agent.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# B008: function-call-in-default-argument - the standard, required pattern
# for typer.Option()/typer.Argument() defaults in cli.py.
ignore = ["B008"]
