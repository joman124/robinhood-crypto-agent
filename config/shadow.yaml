# The forward test: `rhca run` keeps the split account on paper from `start`
# (docs/strategy.md, "The forward test"). It never proposes and never orders:
# after each UTC daily close it writes one `shadow_day` record to the audit log,
# and `rhca shadow` reports on it.
#
# Set by the owner, 2026-09-28: $100 held long-term and $400 in the breakout,
# so the short-term side always has money to trade (changed from 50:50 the same
# day, before the first forward close). No coin may be more than
# max_position_pct_of_portfolio (config/risk_limits.yaml) of the account,
# counting both sleeves; the breakout gets the room first.
#
# Changing anything here, or that limit, restarts the test, so treat it like
# the other config files -- a deliberate change by the owner, never a side
# effect. Delete the file to turn the forward test off.

shadow:
  # The first UTC daily close the test counts: the day after the last bar any
  # backtest in docs/strategy.md had seen. Both rules were fixed before it.
  start: 2026-09-28

  capital: 500

  # Percent of capital in the long-term sleeve; the rest trades the breakout.
  # $100 over four coins is $25 each: five $5 tranches, the minimum trade.
  long_pct: 20

  # How the long-term sleeve buys: dip (buy low -- a weekly tranche only under
  # the 200-day average), dca (a weekly tranche whatever the price) or lump.
  long_mode: dip

  # The coins, for both sleeves. These reach past the watchlist on purpose: the
  # forward test reads Coinbase's public daily closes and trades nothing.
  symbols:
    - BTC-USD
    - ETH-USD
    - SOL-USD
    - XRP-USD
